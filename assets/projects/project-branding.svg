<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A111F"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="goldG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8A6B29"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E34"/>
      <stop offset="100%" stop-color="#0B1322"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgBrand)"/>

  <!-- Geometric Luxury Background Lines -->
  <g stroke="rgba(197, 160, 89, 0.12)" stroke-width="1.2">
    <line x1="0" y1="0" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="200" x2="800" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
  </g>

  <!-- Front Business Card Representation -->
  <g transform="translate(100, 100) rotate(-4)">
    <rect width="320" height="190" rx="14" fill="url(#cardG)" stroke="url(#goldG2)" stroke-width="2" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.8))"/>
    
    <!-- Monogram Circle & Lettering -->
    <circle cx="75" cy="95" r="45" fill="none" stroke="rgba(197, 160, 89, 0.3)" stroke-width="1.5"/>
    <circle cx="75" cy="95" r="38" fill="none" stroke="url(#goldG2)" stroke-width="2"/>
    <text x="75" y="103" fill="#F5D77F" font-family="'Cinzel', serif" font-size="24" font-weight="bold" text-anchor="middle">MGU</text>

    <!-- Divider curve -->
    <path d="M140,20 Q155,95 140,170" fill="none" stroke="url(#goldG2)" stroke-width="2"/>

    <!-- Name & Title -->
    <text x="160" y="85" fill="#F5D77F" font-family="'Cinzel', serif" font-size="12" font-weight="bold" letter-spacing="1">MARTIN GABRIEL UBALDE</text>
    <text x="160" y="105" fill="#94A3B8" font-family="sans-serif" font-size="9" letter-spacing="1">VIRTUAL ASSISTANT</text>
    <text x="160" y="120" fill="#CBD5E1" font-family="sans-serif" font-size="9" letter-spacing="1">IT SERVICE MANAGER</text>
  </g>

  <!-- Back Business Card Representation -->
  <g transform="translate(380, 180) rotate(3)">
    <rect width="320" height="190" rx="14" fill="url(#cardG)" stroke="url(#goldG2)" stroke-width="2" filter="drop-shadow(0 20px 35px rgba(0,0,0,0.9))"/>

    <text x="25" y="40" fill="#F5D77F" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="2">CONNECT WITH US</text>

    <!-- Details -->
    <text x="25" y="75" fill="#CBD5E1" font-family="sans-serif" font-size="9">&bull; martinubalde156@gmail.com</text>
    <text x="25" y="100" fill="#CBD5E1" font-family="sans-serif" font-size="9">&bull; Lipa City, Batangas</text>
    <text x="25" y="125" fill="#CBD5E1" font-family="sans-serif" font-size="9">&bull; (+63) 961 109 7564</text>
    <text x="25" y="150" fill="#38BDF8" font-family="sans-serif" font-size="8.5">&bull; linkedin.com/in/martin-gabriel-ubalde</text>

    <!-- QR Code Mockup -->
    <g transform="translate(230, 45)">
      <rect width="70" height="70" rx="6" fill="#0A101C" stroke="url(#goldG2)" stroke-width="1.5"/>
      <!-- QR Blocks -->
      <rect x="8" y="8" width="16" height="16" fill="#F5D77F"/>
      <rect x="12" y="12" width="8" height="8" fill="#0A101C"/>
      <rect x="46" y="8" width="16" height="16" fill="#F5D77F"/>
      <rect x="50" y="12" width="8" height="8" fill="#0A101C"/>
      <rect x="8" y="46" width="16" height="16" fill="#F5D77F"/>
      <rect x="12" y="50" width="8" height="8" fill="#0A101C"/>
      <rect x="30" y="30" width="10" height="10" fill="#F5D77F"/>
      <rect x="30" y="12" width="8" height="8" fill="#F5D77F"/>
      <rect x="48" y="48" width="12" height="12" fill="#F5D77F"/>
      <text x="35" y="82" fill="#C5A059" font-family="sans-serif" font-size="7" text-anchor="middle">SCAN ME</text>
    </g>
  </g>
</svg>