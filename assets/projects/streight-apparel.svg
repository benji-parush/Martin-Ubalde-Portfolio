<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8A6B29"/>
    </linearGradient>
    <linearGradient id="tshirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg1)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="rgba(197, 160, 89, 0.08)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Accent glow orb -->
  <circle cx="260" cy="240" r="140" fill="url(#glowG)" filter="blur(40px)"/>

  <!-- T-shirt Mockup on left -->
  <g transform="translate(100, 65)">
    <!-- T-Shirt Silhouette -->
    <path d="M120,60 L170,35 L230,35 L280,60 L340,120 L290,170 L270,140 L270,350 L130,350 L130,140 L110,170 L60,120 Z" fill="url(#tshirtGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Collar Cutout -->
    <path d="M170,35 C185,65 215,65 230,35 Z" fill="#0A0F1D" stroke="url(#goldGrad)" stroke-width="1.5"/>
    
    <!-- Graphic on Shirt -->
    <rect x="150" y="130" width="100" height="130" rx="8" fill="rgba(10,15,29,0.7)" stroke="rgba(197,160,89,0.4)" stroke-dasharray="4,4"/>
    <circle cx="200" cy="175" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M188,185 L200,165 L212,185" fill="none" stroke="#F5D77F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="200" y=\"215\" fill="#F5D77F" font-family="'Cinzel', serif" font-size="13" text-anchor="middle" font-weight="bold" letter-spacing="3">STREIGHT</text>
    <text x="200" y=\"230\" fill="#94A3B8" font-family="sans-serif" font-size="8" text-anchor="middle" letter-spacing="2">AUTHENTIC APPAREL</text>
  </g>

  <!-- Card on Right: Internship Highlights & Design Assets -->
  <g transform="translate(490, 85)">
    <rect width="260" height="320" rx="14" fill="#141E33" stroke="rgba(197, 160, 89, 0.35)" stroke-width="1.5"/>
    
    <!-- Header banner -->
    <rect x="15" y="16" width="230" height="32" rx="6" fill="rgba(197, 160, 89, 0.15)"/>
    <text x="28" y="37" fill="#F5D77F" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">STREIGHT CLOTHING CO.</text>
    
    <text x="20" y="76" fill="#F1F5F9" font-family="sans-serif" font-size="14" font-weight="700">Apparel Design &amp; Marketing</text>
    <text x="20" y="96" fill="#94A3B8" font-family="sans-serif" font-size="11">Graphic Design &amp; Video Intern &bull; 2024</text>

    <!-- Divider -->
    <line x1="20" y1="115" x2="240" y2="115" stroke="rgba(255,255,255,0.08)"/>

    <!-- Key Tasks -->
    <text x="20" y="138" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">&bull; Custom T-shirt &amp; Apparel Vectors</text>
    <text x="20" y="162" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">&bull; Product Inventory &amp; Prep Handling</text>
    <text x="20" y="186" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">&bull; Promo Reel &amp; Video Editing</text>
    <text x="20" y="210" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">&bull; Brand Model &amp; Social Ads</text>

    <!-- Color Palette -->
    <text x="20" y="246" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1">BRAND COLOR SPEC</text>
    <circle cx="30" cy="270" r="11" fill="#0F172A" stroke="#fff" stroke-width="1"/>
    <circle cx="62" cy="270" r="11" fill="#C5A059"/>
    <circle cx="94" cy="270" r="11" fill="#38BDF8"/>
    <circle cx="126" cy="270" r="11" fill="#E2E8F0"/>

    <!-- Tool Badges -->
    <rect x="155" y="258" width="85" height="24" rx="12" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)"/>
    <text x="197" y="274" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">Photoshop</text>
  </g>
</svg>