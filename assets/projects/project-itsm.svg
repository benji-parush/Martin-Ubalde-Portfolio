<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgItsm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#080D17"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgItsm)"/>

  <!-- Subtle network nodes in background -->
  <g stroke="rgba(56, 189, 248, 0.1)" stroke-width="1">
    <line x1="120" y1="80" x2="300" y2="140"/>
    <line x1="300" y1="140" x2="520" y2="90"/>
    <line x1="520" y1="90" x2="700" y2="160"/>
    <line x1="300" y1="140" x2="400" y2="350"/>
    <line x1="700" y1="160" x2="620" y2="400"/>
  </g>
  <circle cx="120" cy="80" r="4" fill="rgba(56, 189, 248, 0.4)"/>
  <circle cx="300" cy="140" r="5" fill="rgba(197, 160, 89, 0.6)"/>
  <circle cx="520" cy="90" r="4" fill="rgba(56, 189, 248, 0.4)"/>
  <circle cx="700" cy="160" r="5" fill="rgba(197, 160, 89, 0.5)"/>

  <!-- Main Dashboard Window -->
  <g transform="translate(60, 45)">
    <!-- Window Body -->
    <rect width="680" height="410" rx="14" fill="#111A2E" stroke="rgba(197, 160, 89, 0.3)" stroke-width="1.5" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))"/>
    
    <!-- Title Bar -->
    <rect width="680" height="44" rx="14" fill="#0D1525"/>
    <circle cx="25" cy="22" r="5" fill="#EF4444"/>
    <circle cx="42" cy="22" r="5" fill="#F59E0B"/>
    <circle cx="59" cy="22" r="5" fill="#10B981"/>
    <text x="340" y="27" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="500">ITSM Service Desk &bull; Incident &amp; Request Flow</text>

    <!-- Top KPI cards -->
    <g transform="translate(25, 60)">
      <rect width="140" height="70" rx="8" fill="#18243C" stroke="rgba(255,255,255,0.06)"/>
      <text x="15" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">ACTIVE TICKETS</text>
      <text x="15" y="52" fill="#F1F5F9" font-family="sans-serif" font-size="22" font-weight="bold">18</text>
      <text x="65" y="52" fill="#10B981" font-family="sans-serif" font-size="11">&uarr; 99.4% SLA</text>
    </g>

    <g transform="translate(185, 60)">
      <rect width="140" height="70" rx="8" fill="#18243C" stroke="rgba(255,255,255,0.06)"/>
      <text x="15" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">AVG RESOLUTION</text>
      <text x="15" y="52" fill="#38BDF8" font-family="sans-serif" font-size="22" font-weight="bold">14m</text>
      <text x="80" y="52" fill="#94A3B8" font-family="sans-serif" font-size="11">Tier 1 &amp; 2</text>
    </g>

    <g transform="translate(345, 60)">
      <rect width="140" height="70" rx="8" fill="#18243C" stroke="rgba(255,255,255,0.06)"/>
      <text x="15" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">CSAT SATISFACTION</text>
      <text x="15" y="52" fill="#F5D77F" font-family="sans-serif" font-size="22" font-weight="bold">98.8%</text>
      <text x="100" y="52" fill="#10B981" font-family="sans-serif" font-size="11">&starf; 4.9</text>
    </g>

    <g transform="translate(505, 60)">
      <rect width="150" height="70" rx="8" fill="#18243C" stroke="rgba(197, 160, 89, 0.25)"/>
      <text x="15" y="24" fill="#C5A059" font-family="sans-serif" font-size="10" font-weight="bold">SERVICE SYSTEM</text>
      <text x="15" y="52" fill="#10B981" font-family="sans-serif" font-size="16" font-weight="bold">&bull; All Systems Up</text>
    </g>

    <!-- Ticket Queue Table -->
    <g transform="translate(25, 150)">
      <rect width="630" height="230" rx="10" fill="#141E33" stroke="rgba(255,255,255,0.05)"/>
      
      <!-- Table Header -->
      <rect width="630" height="32" rx="10" fill="#1A2742"/>
      <text x="20" y="21" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">ID</text>
      <text x="80" y="21" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">SERVICE ISSUE / REQUEST</text>
      <text x="320" y="21" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">CATEGORY</text>
      <text x="440" y="21" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">PRIORITY</text>
      <text x="540" y="21" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">STATUS</text>

      <!-- Row 1 -->
      <line x1="0" y1="72" x2="630" y2="72" stroke="rgba(255,255,255,0.04)"/>
      <text x="20" y="56" fill="#F5D77F" font-family="sans-serif" font-size="11" font-weight="bold">#IT-1082</text>
      <text x="80" y="56" fill="#F1F5F9" font-family="sans-serif" font-size="11">Workstation OS Image &amp; Network Auth</text>
      <text x="320" y="56" fill="#CBD5E1" font-family="sans-serif" font-size="11">SysAdmin</text>
      <rect x="440" y="42" width="55" height="20" rx="4" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="467" y="56" fill="#EF4444" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">HIGH</text>
      <rect x="535" y="42" width="75" height="20" rx="10" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="572" y="56" fill="#10B981" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">RESOLVED</text>

      <!-- Row 2 -->
      <line x1="0" y1="114" x2="630" y2="114" stroke="rgba(255,255,255,0.04)"/>
      <text x="20" y="98" fill="#F5D77F" font-family="sans-serif" font-size="11" font-weight="bold">#IT-1083</text>
      <text x="80" y="98" fill="#F1F5F9" font-family="sans-serif" font-size="11">Active Directory Privilege Provisioning</text>
      <text x="320" y="98" fill="#CBD5E1" font-family="sans-serif" font-size="11">Identity</text>
      <rect x="440" y="84" width="55" height="20" rx="4" fill="rgba(245, 158, 11, 0.2)"/>
      <text x="467" y="98" fill="#F59E0B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">MED</text>
      <rect x="535" y="84" width="75" height="20" rx="10" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="572" y="98" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">IN PROGRESS</text>

      <!-- Row 3 -->
      <line x1="0" y1="156" x2="630" y2="156" stroke="rgba(255,255,255,0.04)"/>
      <text x="20" y="140" fill="#F5D77F" font-family="sans-serif" font-size="11" font-weight="bold">#IT-1084</text>
      <text x="80" y="140" fill="#F1F5F9" font-family="sans-serif" font-size="11">Hardware Diagnostic: Memory Bus Fault</text>
      <text x="320" y="140" fill="#CBD5E1" font-family="sans-serif" font-size="11">Hardware</text>
      <rect x="440" y="126" width="55" height="20" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="467" y="140" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">LOW</text>
      <rect x="535" y="126" width="75" height="20" rx="10" fill="rgba(197, 160, 89, 0.2)"/>
      <text x="572" y="140" fill="#F5D77F" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">TRIAGED</text>

      <!-- Row 4 -->
      <text x="20" y="182" fill="#F5D77F" font-family="sans-serif" font-size="11" font-weight="bold">#IT-1085</text>
      <text x="80" y="182" fill="#F1F5F9" font-family="sans-serif" font-size="11">Executive VA Calendar &amp; Mail Automation</text>
      <text x="320" y="182" fill="#CBD5E1" font-family="sans-serif" font-size="11">Workflow</text>
      <rect x="440" y="168" width="55" height="20" rx="4" fill="rgba(245, 158, 11, 0.2)"/>
      <text x="467" y="182" fill="#F59E0B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">MED</text>
      <rect x="535" y="168" width="75" height="20" rx="10" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="572" y="182" fill="#10B981" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">COMPLETED</text>
    </g>
  </g>
</svg>